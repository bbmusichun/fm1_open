# FM1 Open web workbench (browser preview of the instrument).
# The browser build is compiled from the C sources with WASI SDK 27 and served as
# one self-contained HTML page; there is no database, API or external credential.
services:
  web:
    build:
      context: .
      dockerfile: .base44/Dockerfile.web
    working_dir: /workspace
    command: ["sh", "-ec", "node tools/Build-Web-Preview.mjs && exec node tools/Serve-Web-Preview.mjs"]
    volumes:
      - .:/workspace
    environment:
      - FM1_WASI_SDK=/opt/wasi-sdk
      - PORT=3000
      - BASE44_PREVIEW_MODE
    ports:
      - "3000:3000"
    labels:
      base44.project: "FM1 Open workbench"
      base44.kind: web
      base44.port: "3000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6
